<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Turntide">
  <title>Turntide</title>
  <!-- dark board ground -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0e1720"/>
  <!-- the stone, caught mid-flip: one face still teal, the other already amber -->
  <path d="M32 10 A22 22 0 0 0 32 54 Z" fill="#2ec4b6"/>
  <path d="M32 10 A22 22 0 0 1 32 54 Z" fill="#ff9f1c"/>
  <!-- foreshortened rim: the disc is turning edge-on through the seam -->
  <ellipse cx="32" cy="32" rx="6" ry="22" fill="none" stroke="#0e1720" stroke-width="3"/>
</svg>
